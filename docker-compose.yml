# ============================================================
# 小白搜盘 fn-seekbox（Docker 部署 · 现成镜像版）
# ============================================================
#
# 【这是什么？】
# 小白搜盘是一款网盘资源搜索应用：输入关键词，一次搜遍百度、阿里云盘、
# 夸克、天翼、UC、115、迅雷、123 等常见网盘的分享链接。
# 预置 26 个国内可直连搜索插件，深色墨金界面，来源可勾选、
# 连通性可检测、结果按网盘分组、支持导出 JSON/TXT。
#
# 【和官方 FPK 的关系（重要）】
# - 原项目（github.com/kidoneself/fn-seekbox）官方只发布飞牛 fnOS 的
#   FPK 应用包，没有 Docker 镜像。
# - 本 compose 使用的镜像 = 官方 FPK 内的同一套程序（后端 seekbox +
#   网关 gateway.py + 前端），功能与 FPK 完全一致，只是运行在 Docker 里。
#
# 【镜像从哪来？二选一】
# 方式 A（推荐·和道理鱼一样拉镜像）：先 Fork 本仓库到你 GitHub，
#   仓库自带的 .github/workflows/build-docker.yml 会自动构建镜像并推送到
#   ghcr.io。然后把下方 image 里的「你的GitHub用户名」换成你的用户名，
#   即可直接 docker compose up -d 拉取部署，无需本地构建。
# 方式 B（不 fork 仓库·本地构建）：执行 docker build -t fn-seekbox:1.0.0 .
#   构建一次，然后把下方 image 改成 fn-seekbox:1.0.0。
#
# 【部署前准备（方式 A）】
# 1. Fork 仓库 → 等 Actions 构建完成（仓库 Actions 标签页，约 2-3 分钟）
# 2. 若镜像为 Private，去仓库 Packages 页设为 Public（否则拉取要登录）
# 3. 把下方 image 的「你的GitHub用户名」替换成你的用户名
# 4. 在本目录执行：docker compose up -d（第一次自动拉镜像）
#
# 【架构说明】
# 用户(电脑/手机) → fn-seekbox 容器 :12668
#   ├─ Python 网关（对外端口 + 前端页面 + API 反代）
#   └─ Go 搜索后端（容器内部 127.0.0.1:18888，不对外）
# 搜索请求由容器内的网关转发给后端，后端访问各插件站点取结果。
# 若内网访问插件站点受限，可配置 PROXY 走代理（见下方环境变量）。
#
# 【注意】
# - 镜像仅支持 linux/amd64（x86-64），ARM 设备无法运行。
# - 数据（缓存+日志）存在本目录 ./data 下，删除容器不丢数据。
# ============================================================

services:

  fn-seekbox:

    # --------------------------------------------------------
    # 配置项：image（镜像版本）
    # --------------------------------------------------------
    # 方式 A（拉镜像）：ghcr.io/<你的GitHub用户名>/fn-seekbox:latest
    #   例：你的用户名是 zhangsan → ghcr.io/zhangsan/fn-seekbox:latest
    # 方式 B（本地构建）：改成 fn-seekbox:1.0.0
    image: ghcr.io/haochyi-fj/fn-seekbox:latest

    # --------------------------------------------------------
    # 配置项：container_name（容器名称）
    # --------------------------------------------------------
    container_name: fn-seekbox

    # --------------------------------------------------------
    # 配置项：restart（重启策略）
    # --------------------------------------------------------
    # NAS 重启或容器崩溃后自动拉起，保证服务不间断。
    restart: unless-stopped

    # --------------------------------------------------------
    # 配置项：ports（端口映射）
    # --------------------------------------------------------
    # 左侧为宿主机端口，右侧为容器内端口（勿改右侧）。
    # 默认 12668:12668，如需换端口只改左侧，如 "22668:12668"。
    # 只想本机访问可改成 "127.0.0.1:12668:12668"（更安全）。
    ports:
      - "12668:12668"

    # --------------------------------------------------------
    # 配置项：environment（环境变量）
    # --------------------------------------------------------
    # 全部有默认值，不开箱即用；只需按需取消注释修改。
    environment:
      # Web 端口（容器内，与 ports 右侧保持一致）
      APP_PORT: "12668"
      # 时区
      TZ: "Asia/Shanghai"

      # 插件列表（逗号分隔）。默认 26 个国内可直连插件，
      # 不需要改；想精简可只留常用的，如 gying,panlian,qqpd
      # ENABLED_PLUGINS: "gying,panlian,qqpd"

      # 出站代理（可选）：内网访问不了插件站点时配置
      # 支持 http://主机:端口 或 socks5://主机:端口
      # PROXY: "http://192.168.1.100:7890"

      # 搜索缓存与性能（默认值已适配大多数场景）
      # CACHE_ENABLED: "true"
      # CACHE_TTL: "60"          # 缓存有效期（分钟）
      # MAX_CONCURRENCY: "200"   # 最大并发
      # MAX_PAGES: "30"          # 单插件最大翻页数

      # 访问认证（可选，默认关闭。开启后访问需要登录）
      # AUTH_ENABLED: "true"
      # AUTH_USERS: "admin:admin123"          # 格式 用户名:密码，多账号逗号分隔
      # AUTH_TOKEN_EXPIRY: "24"               # 令牌有效期（小时）
      # AUTH_JWT_SECRET: "please-change-me"   # 密钥，务必改掉

    # --------------------------------------------------------
    # 配置项：volumes（数据持久化）
    # --------------------------------------------------------
    # ./data 是相对路径，会在本 compose 所在目录下自动创建 data
    # 文件夹，缓存和日志都存在里面，容器删除重建不丢数据。
    # 可改成任意想放的位置，如 /vol1/1000/Docker/fn-seekbox/data
    volumes:
      - ./data:/app/data

    # --------------------------------------------------------
    # 配置项：healthcheck（健康检查）
    # --------------------------------------------------------
    # 每 30 秒检查一次：经网关访问后端 /api/health，验证整条链路。
    # 容器内有现成脚本，失败由 Docker 判定不健康并配合 restart 重启。
    healthcheck:
      test: ["CMD", "/app/docker-healthcheck.sh"]
      interval: 30s          # 每 30 秒检查一次
      timeout: 10s           # 单次检查超时 10 秒
      retries: 3             # 连续失败 3 次判定不健康
      start_period: 40s      # 启动后 40 秒再检查，给后端启动留时间

    # --------------------------------------------------------
    # 配置项：logging（日志限制）
    # --------------------------------------------------------
    # 限制容器标准输出日志大小，防止长期运行占满 NAS 硬盘。
    logging:
      driver: json-file
      options:
        max-size: "10m"       # 单个日志文件最大 10MB
        max-file: "3"         # 最多保留 3 个日志文件

    # --------------------------------------------------------
    # 配置项：cap_drop（安全加固，可选）
    # --------------------------------------------------------
    # 剥夺容器 Linux 特权能力。本服务只监听 12668 端口（>1024
    # 非特权端口），cap_drop: ALL 是安全的；若后续异常可注释掉。
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # --------------------------------------------------------
    # 配置项：资源限制（可选）
    # --------------------------------------------------------
    # 搜索服务吃网络和 CPU，给 2 核 + 1G 上限足够，防止跑飞拖垮 NAS。
    # cpus: '2.00'
    # mem_limit: 1G
    # mem_reservation: 256M
